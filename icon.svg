<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" role="img" aria-label="Background task engine">
  <!-- One dominant subject: a task ledger with three ordered step marks and a
       status light for a run in progress. Flat fills, no tile, transparent
       background, no text. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- sheet -->
    <rect x="7" y="4.8" width="22" height="26.4" rx="3.6" fill="#FBFCFE" stroke="#3D4A5C" stroke-width="2.3"/>
    <!-- header separator -->
    <path d="M7 12.2h22" stroke="#3D4A5C" stroke-width="2.3"/>
    <!-- run status light in the header -->
    <circle cx="24.2" cy="8.5" r="2.1" fill="#2F7A57" stroke="none"/>

    <!-- step 1: completed -->
    <path d="M11.4 17.3l2.1 2.1 3.7-4.2" stroke="#2F7A57" stroke-width="2.3"/>
    <path d="M21.6 17.6h3.4" stroke="#8A97A8" stroke-width="2"/>
    <!-- step 2: completed -->
    <path d="M11.4 23.2l2.1 2.1 3.7-4.2" stroke="#2F7A57" stroke-width="2.3"/>
    <path d="M21.6 23.5h3.4" stroke="#8A97A8" stroke-width="2"/>
    <!-- step 3: pending -->
    <circle cx="13.9" cy="28.9" r="1.9" stroke="#8A97A8" stroke-width="2"/>
    <path d="M21.6 29.1h3.4" stroke="#C2CBD8" stroke-width="2"/>
  </g>
</svg>
